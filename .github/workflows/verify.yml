name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate fixtures (must be reproducible - no diff)
        run: |
          python3 fixtures/generate.py
          git diff --exit-code -- fixtures index.html examples \
            || (echo "::error::fixtures/index.html/examples drifted; run fixtures/generate.py and commit" && exit 1)

      # ---- P-256 / ES256 / WebAuthn (bundle §9–§10) --------------------------
      # verify.py pins RFC 6979 §A.2.5 (copied from the RFC, cross-checked with
      # the p256 crate), strict DER, both decompression parities, the SMT and the
      # bc30-v2 KAT vectors shared with ann-core and the console.
      - name: CLI - P-256 / SMT / KAT selftest
        run: python3 verify-cli/verify.py --selftest

      - name: Worked examples (link A/B/C, both schemes, tamper detection)
        run: bash examples/run.sh

      - name: CLI - valid bundle must PASS
        run: python3 verify-cli/verify.py fixtures/sample-bundle.valid.json

      - name: CLI - tampered bundle must FAIL
        run: |
          if python3 verify-cli/verify.py fixtures/sample-bundle.tampered.json; then
            echo "::error::tampered bundle unexpectedly verified" && exit 1
          else
            echo "tampered correctly rejected"
          fi

      - name: CLI - tampered §5 chain bundle must FAIL
        run: |
          if python3 verify-cli/verify.py fixtures/sample-bundle.tampered-chain.json; then
            echo "::error::tampered-chain bundle unexpectedly verified" && exit 1
          else
            echo "tampered chain correctly rejected"
          fi

      - name: Browser JS == Python == ann-core test vector
        run: node fixtures/browser-js-check.mjs

      # ---- bundle v4 (identity-bound issuance, schema §12) ------------------
      # Python is the oracle (fixtures/v4-expected.json). The CLI is re-run as a
      # subprocess for every row so exit codes 0/1/2/3/64 are asserted end to end,
      # and the shipped browser runV4 must reproduce every grade, axis and step.
      - name: v4 - engine KAT copy (sha256-pinned to ann-core bc30-v2-kat.json) re-derives byte-for-byte from its inputs
        run: python3 fixtures/engine-kat-check.py

      - name: v4 - CLI exit-code matrix (0 valid / 1 rejected / 2 warning / 3 undetermined / 64 usage)
        run: python3 fixtures/v4-rc-matrix.py

      - name: v4 - zk-core.js P-256/WebAuthn known answers (subtle + pure BigInt)
        run: node fixtures/p256/kat.mjs

      - name: v4 - index.html runV4 reproduces the Python oracle (grade · axes · every step)
        run: node fixtures/v4-grade-check.mjs

      # ---- bundle v5 (role-labelled multi-signature issuance, schema §12) ----
      # Same oracle discipline as v4: fixtures/v5-expected.json is written by
      # verify.py; the CLI matrix asserts exit codes 0/1/2 per fixture and the
      # shipped browser runV5 must reproduce every grade, axis and step. The
      # 0x10 primitives themselves are pinned by the multisig node KAT.
      - name: v5 - zk-core.js 0x10 / wallet / policy primitives match the engine KAT (27 negatives included)
        run: node fixtures/multisig/kat.mjs

      # ---- ③ inscription tier (frozen spec 2026-09-02, MUST 14-26) ----------
      # The verifier ships BEFORE the issuing path: an older verifier marks a ③
      # bundle REJECTED, indistinguishable from a forgery, so something able to
      # read the first ③ bundle has to exist first. The engine KAT's 29 negatives
      # are pinned by their ERROR IDENTIFIER in both implementations, and every
      # one of them is also a complete v5 file in fixtures/v5/ins-neg-*.json.
      - name: ③ - zk-core.js matches the engine KAT's inscription section (29 negatives included)
        run: node fixtures/inscription/kat.mjs

      - name: v5 - CLI exit-code matrix (0 valid / 1 rejected / 2 warning / 3 undetermined - ③ included)
        run: python3 fixtures/v5-rc-matrix.py

      - name: v5 - index.html runV5 reproduces the Python oracle (grade · axes · every step)
        run: node fixtures/v5-grade-check.mjs

      # ---- zk (bundle §8) -------------------------------------------------
      # Three implementations of one frozen contract: the Go engine, zk-core.js
      # and index.html's inlined copy. Nothing but these gates stops them
      # drifting, and a drift shows up as "does not verify" with no clue why -
      # so the conformance runner compares the CHALLENGE STREAM step by step
      # and names the exact challenge where two implementations part company.
      - name: zk - index.html inline copy matches zk-core.js
        run: node tools/inline-zk.mjs --check

      - name: zk - JS matches the Go golden vectors (generators, digest, challenges)
        run: node fixtures/zk/conformance.mjs

      - name: zk + P-256 - the inlined verifier that actually ships still runs
        run: node fixtures/zk/browser-path.mjs

      - name: Publish SHA256(index.html) for reproducible-build matching
        run: |
          sha256sum index.html | tee index.html.sha256
          echo "### \`SHA256(index.html)\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat index.html.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: index-html-sha256
          path: index.html.sha256
