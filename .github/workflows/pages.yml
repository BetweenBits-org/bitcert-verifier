name: pages

# Publishes the independent verifier (single self-contained index.html) to
# GitHub Pages so anyone can reach a PUBLIC, backend-free verifier URL:
#   https://github.com/BetweenBits-org/bitcert-verifier/
#
# index.html is GENERATED by fixtures/generate.py — it is NOT hand-edited and
# this workflow does NOT edit it. It stages a COPY of the committed index.html
# (plus examples/ for the worked scenarios) into a publish dir and deploys that.
#
# ONE-TIME MANUAL STEP (the user must do this once, in the GitHub web UI):
#   Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# This workflow does NOT and cannot change that repo setting.

on:
  push:
    branches: [feat/reg18h-daily-attestation, main]
  workflow_dispatch:

# Pages deployment needs these scopes; nothing else is granted.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; don't cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site (copy generated index.html — do NOT edit source)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # index.html served at the site ROOT -> URL ends in /bitcert-verifier/
          cp index.html _site/index.html
          # Disable Jekyll so files (incl. any leading-underscore/dotfiles) are
          # served verbatim.
          touch _site/.nojekyll
          # Ship the worked examples so the bundles referenced by the verifier
          # are reachable next to it.
          if [ -d examples ]; then
            cp -R examples _site/examples
          fi
          echo "Staged site contents:"
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
